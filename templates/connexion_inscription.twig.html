                        <!-- Formulaires de connexion -->
            <div class="auth-form-container" id="auth-form-container" style="display:none;">
                <div class="auth-form-header">
                    <button type="button" class="auth-back-to-role" aria-label="Retour à la sélection">&larr;</button>
                    <h2 id="auth-role-title">Connexion Admin</h2>
                    <button type="button" class="auth-modal-close" aria-label="Fermer">&times;</button>
                </div>
                <div class="auth-tabs">
                    <button class="auth-tab active" type="button" data-tab="connexion">Connexion</button>
                    <button class="auth-tab" type="button" data-tab="inscription" data-role="admin">Inscription</button>
                </div>
                <div class="auth-modal-body">
                    <form class="auth-form auth-form-connexion" style="display:block;" action="/auth/login" method="post">
                    <input type="hidden" name="role" id="roleInput" value="">
                    <label class="auth-label">Adresse email</label>
                    <input type="email" name="emailLin" class="auth-input" placeholder="alex@exemple.fr" required>
                    <label class="auth-label">Mot de passe</label>
                    <input type="password" name="mdpLin" class="auth-input" placeholder="••••••••" required>
                    <button type="submit" class="auth-submit">Se connecter</button>
                    <div class="auth-links">
                        <a href="#">Mot de passe oublié ?</a>
                    </div>
                    <div class="auth-divider">
                        <span>ou continuer avec</span>
                    </div>
                    <div class="auth-social">
                        <button type="button">

                            GitHub

                    <div class="auth-signup-link">

                    </div>

                    <input type="email" name="emailSup" class="auth-input" placeholder="alex@exemple.fr" required>

                    <div class="auth-divider">
