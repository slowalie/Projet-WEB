<div class="auth-modal" id="popUpLoginPage" aria-hidden="true" data-auth-can-signup="{% if is_authenticated and (user_role == 'pilote' or user_role == 'admin') %}1{% else %}0{% endif %}">
    <div class="auth-modal-backdrop" data-auth-close="true"></div>

    <div class="auth-modal-panel" role="dialog" aria-modal="true" aria-label="Connexion et inscription">
        <button class="auth-close" type="button" id="authCloseButton" aria-label="Fermer">×</button>

        <div class="auth-forms-space">
            <form class="auth-form loginPart" id="loginPart" action="/auth/login" method="post">
                <h2>Se connecter</h2>
                <div class="role-selector">
                    <label class="role-option ">
                        <input type="radio" name="role" value="etudiant">
                        <div class="role-span">Candidat</div>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="pilote">
                        <div class="role-span">Pilote</div>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="admin">
                        <div class="role-span">Admin</div>
                    </label>
                </div>
                <label for="emailLin">E-mail</label>
                <input type="email" id="emailLin" name="emailLin" class="auth-input" required>

                <label for="mdpLin">Mot de passe</label>
                <div class="auth-password-wrap">
                    <input type="password" id="mdpLin" name="mdpLin" class="auth-input" required>
                    <button class="auth-show-password" type="button" id="showLoginPswd" aria-label="Afficher le mot de passe">👁</button>
                </div>

                <label class="auth-remember" for="remenberMeLin">
                    <input type="checkbox" id="remenberMeLin" name="remenberMeLin">
                    <span>Se souvenir de moi</span>
                </label>

                <button type="submit" class="auth-submit">Se connecter</button>
            </form>

            {% if is_authenticated and (user_role == 'pilote' or user_role == 'admin') %}
                <button class="auth-side-switch" type="button" id="closedLoginPart" aria-label="Basculer vers connexion"></button>

                <form class="auth-form signUpPart" id="signUpPart" action="/auth/register" method="post">
                    <h2>Creer son compte</h2>
                    <div class="role-selector">
                        <label class="role-option ">
                            <input type="radio" name="role" value="candidat">
                            <div class="role-span">Candidat</div>
                        </label>
                        {% if user_role == 'admin' %}
                            <label class="role-option">
                                <input type="radio" name="role" value="pilote">
                                <div class="role-span">Pilote</div>
                            </label>
                        {% endif %}
                    </div>
                    
                    <label for="emailSup">E-mail</label>
                    <input type="email" id="emailSup" name="emailSup" class="auth-input" required>

                    <label for="nomSup">Nom</label>
                    <input type="text" id="nomSup" name="nomSup" class="auth-input" required>

                    <label for="prenomSup">Prenom</label>
                    <input type="text" id="prenomSup" name="prenomSup" class="auth-input" required>

                    <label for="mdpSup">Mot de passe</label>
                    <div class="auth-password-wrap">
                        <input type="password" id="mdpSup" name="mdpSup" class="auth-input" required>
                        <button class="auth-show-password" type="button" id="showSignUpPswd" aria-label="Afficher le mot de passe">👁</button>
                    </div>

                    <label class="auth-remember" for="remenberMeSup">
                        <input type="checkbox" id="remenberMeSup" name="remenberMeSup">
                        <span>Se souvenir de moi</span>
                    </label>

                    <button type="submit" class="auth-submit">Creer mon compte</button>
                </form>

                <button class="auth-side-switch" type="button" id="closedSignUpPart" aria-label="Basculer vers inscription"></button>
            {% endif %}
        </div>
    </div>
</div>
